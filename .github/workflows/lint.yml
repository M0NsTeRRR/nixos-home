---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint nix config
on:
  - push
  - pull_request
permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@v31.11.2
      - name: Run flake check
        run: nix flake check
      - name: Run nix fmt
        run: nix fmt
